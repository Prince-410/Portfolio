<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050d" />
      <stop offset="100%" stop-color="#0c0c16" />
    </linearGradient>
    
    <!-- Accent Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark glassmorphic background -->
  <rect width="100" height="100" rx="30" fill="url(#bgGrad)" stroke="#1e1e38" stroke-width="1.5" />
  
  <!-- Outer glowing border line -->
  <rect x="2" y="2" width="96" height="96" rx="28" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.8" filter="url(#neonGlow)" />

  <!-- Accent glow point -->
  <circle cx="50" cy="50" r="30" fill="url(#neonGrad)" opacity="0.15" filter="url(#neonGlow)" />

  <!-- Styled Futuristic 'P' -->
  <g filter="url(#neonGlow)">
    <!-- Vertical stem -->
    <rect x="34" y="26" width="7" height="48" rx="3.5" fill="url(#neonGrad)" />
    <!-- Loop of the P -->
    <path d="M 37.5 26 
             H 54 
             A 14 14 0 0 1 68 40 
             A 14 14 0 0 1 54 54 
             H 37.5" 
          fill="none" 
          stroke="url(#neonGrad)" 
          stroke-width="7" 
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
